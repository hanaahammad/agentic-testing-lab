<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NileBank{% endblock %} · NileBank Online</title>
  <link rel="stylesheet" href="/static/nilebank.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/" data-testid="brand"><span class="logo">N</span> NileBank</a>
    {% if user %}
    <nav data-testid="main-nav">
      <a href="/dashboard" data-testid="nav-dashboard" class="{{ 'active' if nav == 'dashboard' }}">Accounts</a>
      <a href="/transfer" data-testid="nav-transfer" class="{{ 'active' if nav == 'transfer' }}">Transfer</a>
      <a href="/beneficiaries" data-testid="nav-beneficiaries" class="{{ 'active' if nav == 'beneficiaries' }}">Beneficiaries</a>
      <a href="/history" data-testid="nav-history" class="{{ 'active' if nav == 'history' }}">History</a>
    </nav>
    <div class="who"><span data-testid="user-name">{{ user.full_name }}</span>
      <a href="/logout" data-testid="logout-link">Sign out</a></div>
    {% endif %}
  </div>
</header>
{% block body %}{% endblock %}
<footer>NileBank Online · test environment · build <span data-testid="build">{{ build }}</span></footer>
</body>
</html>
