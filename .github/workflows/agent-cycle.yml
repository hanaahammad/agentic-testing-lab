# The QA agent's full cycle in CI: design -> write scripts -> run -> triage -> repair -> GitHub Issues.
# Trigger it by hand (Actions tab > QA agent cycle > Run workflow) or on the weekday schedule.
# Without an ANTHROPIC_API_KEY secret it runs in demo mode, so you can try it for free.
name: QA agent cycle

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story id (e.g. STORY-003) or ALL"
        default: "ALL"
  schedule:
    - cron: "0 5 * * 1-5"   # 08:00 Cairo time, Monday to Friday

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://127.0.0.1:8000
      MINIBANK_FIXED: ${{ vars.MINIBANK_FIXED || '0' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Start MiniBank (application under test)
        run: |
          nohup python -m uvicorn app_under_test.minibank:app --host 127.0.0.1 --port 8000 > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf $BASE_URL/health && break; sleep 1; done

      - name: Run the QA agent
        run: |
          MODE=""
          if [ -z "$ANTHROPIC_API_KEY" ]; then MODE="--demo"; echo "No API key secret: running in demo mode"; fi
          python -m agent.cli cycle --story "${{ inputs.story || 'ALL' }}" --tracker github $MODE

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-reports
          path: reports/

      # Human gate: new or repaired test scripts arrive as a pull request for review.
      - name: Propose updated tests as a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: agent/generated-tests
          add-paths: tests/generated/*.py
          commit-message: "QA agent: update generated tests"
          title: "QA agent: updated generated tests"
          body: |
            The QA agent wrote or repaired these test scripts during its scheduled cycle.
            Review them like any other code: once merged, the Regression tests workflow runs them on every push.
          labels: agent-generated
