# The QA agent's full cycle in CI: discover -> design -> write scripts -> run -> triage -> repair -> GitHub Issues.
# Trigger it by hand (Actions tab > QA agent cycle > Run workflow) or on the weekday schedule.
# Without an ANTHROPIC_API_KEY secret it runs in demo mode, so you can try it for free.
name: QA agent cycle

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Application under test"
        type: choice
        options: [nilebank, minibank]
        default: nilebank
      story:
        description: "Story id (e.g. STORY-104) or ALL"
        default: "ALL"
  schedule:
    - cron: "0 5 * * 1-5"   # 08:00 Cairo time, Monday to Friday

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent:
    runs-on: ubuntu-latest
    env:
      APP: ${{ inputs.app || 'nilebank' }}
      MINIBANK_FIXED: ${{ vars.MINIBANK_FIXED || '0' }}
      NILEBANK_FIXED: ${{ vars.NILEBANK_FIXED || '0' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install the browser for UI tests
        run: python -m playwright install --with-deps chromium

      - name: Run the QA agent (it starts the app itself)
        run: |
          MODE=""
          if [ -z "$ANTHROPIC_API_KEY" ]; then MODE="--demo"; echo "No API key secret: running in demo mode"; fi
          FIXED=""
          if [ "$APP" = "nilebank" ] && [ "$NILEBANK_FIXED" = "1" ]; then FIXED="--fixed"; fi
          if [ "$APP" = "minibank" ] && [ "$MINIBANK_FIXED" = "1" ]; then FIXED="--fixed"; fi
          python -m agent.cli cycle --app "$APP" --story "${{ inputs.story || 'ALL' }}" --start-app $FIXED --tracker github $MODE

      - name: Build the dashboard
        if: always()
        run: python -m agent.dashboard --app "$APP" || true

      - name: Upload reports and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-reports-${{ env.APP }}
          path: |
            reports/
            dashboard/

      # Human gate: new or repaired test scripts arrive as a pull request for review.
      - name: Propose updated tests as a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: agent/generated-tests-${{ env.APP }}
          add-paths: tests/*/generated/*.py
          commit-message: "QA agent: update generated ${{ env.APP }} tests"
          title: "QA agent: updated generated ${{ env.APP }} tests"
          body: |
            The QA agent wrote or repaired these test scripts during its cycle.
            Review them like any other code: once merged, the Regression tests workflow runs them on every push.
          labels: agent-generated
