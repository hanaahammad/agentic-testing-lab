# Runs every committed, agent-written test (API + Playwright UI) on each push and pull request.
# This is the "CI runs the tests" half of the loop: deterministic and free.
name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MINIBANK_URL: http://127.0.0.1:8000
      NILEBANK_URL: http://127.0.0.1:8001
      # Repo variables MINIBANK_FIXED=1 / NILEBANK_FIXED=1 simulate "the developers shipped the fixes".
      MINIBANK_FIXED: ${{ vars.MINIBANK_FIXED || '0' }}
      NILEBANK_FIXED: ${{ vars.NILEBANK_FIXED || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install the browser for UI tests
        run: python -m playwright install --with-deps chromium

      - name: Start the applications under test
        run: |
          nohup python -m uvicorn app_under_test.minibank:app --host 127.0.0.1 --port 8000 > minibank.log 2>&1 &
          nohup python -m uvicorn apps.nilebank.app:app --host 127.0.0.1 --port 8001 > nilebank.log 2>&1 &
          for i in $(seq 1 30); do curl -sf $MINIBANK_URL/health && curl -sf $NILEBANK_URL/api/health && break; sleep 1; done

      - name: Run agent-generated tests
        run: |
          mkdir -p reports
          python -m pytest tests -q --junitxml=reports/junit.xml || code=$?
          # exit code 5 = no tests collected yet, which is fine for a fresh repo
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 5 ]; then exit $code; fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: reports/junit.xml
